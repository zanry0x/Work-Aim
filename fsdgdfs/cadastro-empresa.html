<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Empresa | Portal de Vagas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-body: #f8fafc;
            --sidebar-bg: #0f172a;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --card-white: #ffffff;
            --border-color: #e2e8f0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .cadastro-container {
            max-width: 800px;
            width: 100%;
            background: var(--card-white);
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .cadastro-header { background: var(--sidebar-bg); color: white; padding: 40px; text-align: center; }
        .cadastro-header h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 12px; }
        .cadastro-header p { color: #94a3b8; font-size: 14px; }

        .cadastro-content { padding: 40px; }
        .section-title { font-size: 16px; font-weight: 600; color: var(--primary); margin: 32px 0 16px 0; display: flex; align-items: center; gap: 8px; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { margin-bottom: 20px; position: relative; }
        .form-label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 500; color: var(--text-main); }

        .form-input, .form-select, textarea {
            width: 100%; padding: 12px 16px; border: 1px solid var(--border-color); border-radius: 10px;
            font-size: 14px; background: #fcfcfd; transition: 0.2s; outline: none;
        }

        .form-input:focus, .form-select:focus { border-color: var(--primary); background: white; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }

        .password-wrapper { position: relative; }
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-muted);
            background: none;
            border: none;
            display: flex;
            align-items: center;
        }
        .toggle-password:hover { color: var(--primary); }

        .btn-submit {
            width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 12px;
            font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 24px;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-submit:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .btn-submit:disabled { background: #cbd5e1; cursor: not-allowed; }

        @media(max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="cadastro-container">
    <header class="cadastro-header">
        <h1><i data-lucide="building-2"></i> Cadastro Empresa</h1>
        <p>Preencha os dados da sua empresa para anunciar vagas</p>
    </header>

    <main class="cadastro-content">
        <form id="cadastroForm">
            <div class="section-title"><i data-lucide="info"></i> Dados Institucionais</div>
            <div class="form-grid">
                <div class="form-group" style="grid-column: span 2;">
                    <label class="form-label">Razão Social</label>
                    <input type="text" id="razaoSocial" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Nome Fantasia</label>
                    <input type="text" id="nomeFantasia" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">CNPJ</label>
                    <input type="text" id="cnpj" class="form-input" placeholder="00.000.000/0000-00" maxlength="18" required>
                </div>
                <div class="form-group">
                    <label class="form-label">E-mail Corporativo</label>
                    <input type="email" id="email" class="form-input" required placeholder="exemplo@empresa.com">
                </div>
                <div class="form-group">
                    <label class="form-label">Senha de Acesso</label>
                    <div class="password-wrapper">
                        <input type="password" id="senha" class="form-input" placeholder="Mínimo 6 caracteres" required>
                        <button type="button" class="toggle-password" id="btnTogglePassword">
                            <i data-lucide="eye" id="iconEye"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="section-title"><i data-lucide="layout"></i> Perfil da Empresa</div>
            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label">Porte da Empresa</label>
                    <select id="porte" class="form-select" required>
                        <option value="">Selecione...</option>
                        <option value="MEI">MEI (Microempreendedor Individual)</option>
                        <option value="ME">ME (Microempresa)</option>
                        <option value="EPP">EPP (Empresa de Pequeno Porte)</option>
                        <option value="Média">Média empresa</option>
                        <option value="Grande">Grande empresa</option>
                        <option value="Startup">Startup</option>
                        <option value="ONG">ONG</option>
                        <option value="Órgão Público">Órgão público</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Qtd. de Funcionários</label>
                    <select id="quantidadeFuncionarios" class="form-select" required>
                        <option value="">Selecione...</option>
                        <option value="1-5">1 a 5</option>
                        <option value="6-20">6 a 20</option>
                        <option value="21-50">21 a 50</option>
                        <option value="51-200">51 a 200</option>
                        <option value="201-500">201 a 500</option>
                        <option value="501-1000">501 a 1000</option>
                        <option value="+1000">Mais de 1000</option>
                    </select>
                </div>
                <div class="form-group" style="grid-column: span 2;">
                    <label class="form-label">Segmento / Área de Atuação</label>
                    <input type="text" id="segmento" class="form-input" placeholder="Ex: TI, Construção, Comércio, Saúde..." required>
                </div>
            </div>

            <div class="section-title"><i data-lucide="map-pin"></i> Localização</div>
            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label">CEP</label>
                    <input type="text" id="cep" class="form-input" maxlength="9" placeholder="00000-000" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Estado</label>
                    <input type="text" id="estado" class="form-input" placeholder="Estado">
                </div>
                <div class="form-group" style="grid-column: span 2;">
                    <label class="form-label">Endereço Completo</label>
                    <input type="text" id="endereco" class="form-input" required>
                </div>
            </div>

            <div class="section-title"><i data-lucide="file-text"></i> Descrição</div>
            <div class="form-group">
                <label class="form-label">Sobre a Empresa (Cultura, Missão...)</label>
                <textarea id="sobreEmpresa" class="form-input" rows="3" required></textarea>
            </div>

            <button type="submit" id="btnSubmit" class="btn-submit">Finalizar Cadastro Empresa <i data-lucide="check-circle"></i></button>
        </form>
    </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

<script>
    // Inicializa Lucide Icons
    lucide.createIcons();

    const firebaseConfig = { 
        apiKey: "AIzaSyC3B5WcBUQIY1iuwJ5sKmgvivA8O-rG7z0",
        authDomain: "meuportaldevagas.firebaseapp.com",
        projectId: "meuportaldevagas",
        storageBucket: "meuportaldevagas.firebasestorage.app",
        messagingSenderId: "77991933793",
        appId: "1:77991933793:web:2e8df544915ce3dc463720",
        measurementId: "G-JMEWXD1DYW" 
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    // Controle de exibição da senha
    const btnTogglePassword = document.getElementById("btnTogglePassword");
    const inputSenha = document.getElementById("senha");
    const iconEye = document.getElementById("iconEye");

    btnTogglePassword.addEventListener("click", () => {
        if (inputSenha.type === "password") {
            inputSenha.type = "text";
            iconEye.setAttribute("data-lucide", "eye-off");
        } else {
            inputSenha.type = "password";
            iconEye.setAttribute("data-lucide", "eye");
        }
        lucide.createIcons();
    });

    // Auto-completar CEP simplificado usando a API ViaCEP
    document.getElementById("cep").addEventListener("blur", async (e) => {
        const cep = e.target.value.replace(/\D/g, "");
        if (cep.length === 8) {
            try {
                const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                const data = await response.json();
                if (!data.erro) {
                    document.getElementById("estado").value = data.uf;
                    document.getElementById("endereco").value = `${data.logradouro}, ${data.bairro} - ${data.localidade}`;
                }
            } catch (err) {
                console.error("Erro ao buscar CEP", err);
            }
        }
    });

    // Processamento do Formulário de Cadastro da Empresa
    const cadastroForm = document.getElementById("cadastroForm");
    cadastroForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = document.getElementById("email").value.trim();
        const senha = document.getElementById("senha").value;
        const nomeFantasia = document.getElementById("nomeFantasia").value.trim();
        const btnSubmit = document.getElementById("btnSubmit");

        try {
            btnSubmit.innerText = "Criando Conta...";
            btnSubmit.disabled = true;

            // 1. Cria o usuário no Authentication do Firebase
            const userCredential = await auth.createUserWithEmailAndPassword(email, senha);
            const user = userCredential.user;

            console.log("Conta criada no Auth com UID:", user.uid);

            // 2. Organiza o objeto para salvar exatamente na coleção "Empresas"
            const dadosEmpresa = {
                uid: user.uid,
                authId: user.uid,
                tipo: "empresa", // Crucial para o login inteligente saber quem é
                nome: nomeFantasia,
                razaoSocial: document.getElementById("razaoSocial").value.trim(),
                cnpj: document.getElementById("cnpj").value.trim(),
                email: email,
                porte: document.getElementById("porte").value,
                quantidadeFuncionarios: document.getElementById("quantidadeFuncionarios").value,
                segmento: document.getElementById("segmento").value.trim(),
                cep: document.getElementById("cep").value.replace(/\D/g, ''),
                estado: document.getElementById("estado").value,
                endereco: document.getElementById("endereco").value.trim(),
                sobre: document.getElementById("sobreEmpresa").value.trim(),
                dataCadastro: new Date().toLocaleString("pt-BR")
            };

            // 3. Salva no Firestore usando o UID único do Authentication como título do Documento
            await db.collection("Empresas").doc(nomeFantasia).set(dadosEmpresa);

            alert(`Empresa "${nomeFantasia}" cadastrada com sucesso!`);
            
            // Grava os dados da sessão local para pular o login imediatamente
            localStorage.setItem("empresaNome", nomeFantasia);
            localStorage.setItem("sessaoAtiva", "true");

            // Redireciona a empresa para o painel de criação de vagas
            window.location.href = "cadastro-vaga.html";

        } catch (error) {
            console.error("Erro no processo de cadastro corporativo:", error);
            if (error.code === 'auth/email-already-in-use') {
                alert("Este e-mail corporativo já está cadastrado em nossa plataforma.");
            } else if (error.code === 'auth/weak-password') {
                alert("A senha de acesso precisa ter pelo menos 6 caracteres.");
            } else {
                alert("Não foi possível finalizar o cadastro: " + error.message);
            }
            btnSubmit.disabled = false;
            btnSubmit.innerHTML = 'Finalizar Cadastro Empresa <i data-lucide="check-circle"></i>';
            lucide.createIcons();
        }
    });
</script>
</body>
</html>
