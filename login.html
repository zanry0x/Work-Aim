<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>

<body>

<div class="container">

<!-- ESQUERDA -->
<div class="left">
  <div class="form-wrapper">

    <div class="header">
      <h1>Entrar</h1>
      <p>Ainda não possui conta? <a href="cadastro-trabalhador.html">Cadastrar-se</a></p>
    </div>

    <div class="card">

<form id="loginForm">

<input 
type="email" 
id="email" 
name="email" 
placeholder="E-mail"
required
>

<div class="input-group">

<input 
type="password" 
id="senha" 
name="senha" 
placeholder="Senha"
required
>

<i 
class="fas fa-eye toggle-password" 
onclick="toggleSenha('senha', this)"
></i>

</div>

<button type="submit">
Entrar
</button>

</form>

    </div>
  </div>
</div>

<!-- DIREITA -->
<div class="right">
  <img src="WorkAim2.png" class="logo">
</div>

</div>

<script>

/* ================= TOGGLE SENHA ================= */
function toggleSenha(id, icon){

  const input = document.getElementById(id);

  input.type = input.type === "password"
    ? "text"
    : "password";

  icon.classList.toggle("fa-eye");
  icon.classList.toggle("fa-eye-slash");
}

/* ================= LOGIN ================= */
document
.getElementById("loginForm")
.addEventListener("submit", function(e){

e.preventDefault();

const email = document.getElementById("email").value;
const senha = document.getElementById("senha").value;

/* ================= DADOS ================= */
localStorage.setItem(
  "empresaNome",
  email || "Empresa"
);

localStorage.setItem(
  "empresaCNPJ",
  "12.345.678/0001-90"
);

localStorage.setItem(
  "empresaStatus",
  "ativa"
);

/* ================= REDIRECIONAMENTO ================= */
window.location.href = "numero2.html";

});

</script>

</body>
</html>
