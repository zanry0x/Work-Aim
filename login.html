<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Vagas</title>
<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
/* Gradiente verde conforme solicitado */
background: linear-gradient(135deg, #4ade80, #16a34a);
height: 100vh;
display: flex;
justify-content: center;
align-items: center;
}

.card {
background-color: #121212; /* Quase preto */
padding: 40px;
border-radius: 16px;
width: 100%;
max-width: 400px;
box-shadow: 0 10px 25px rgba(0,0,0,0.5);
text-align: center;
}

h2 {
color: white;
margin-bottom: 30px;
font-size: 2rem;
font-weight: 600;
}

.input-group {
margin-bottom: 20px;
text-align: left;
}

label {
color: #ccc;
font-size: 0.9rem;
margin-bottom: 5px;
display: block;
}

input {
width: 100%;
padding: 12px;
background-color: #2c2c2c; /* Cinza escuro para contraste no card preto */
border: 1px solid #333;
border-radius: 8px;
color: white;
font-size: 1rem;
outline: none;
transition: border-color 0.3s;
}

input:focus {
border-color: #4ade80;
}

button.btn-submit {
width: 100%;
padding: 12px;
background-color: #2563eb; /* Azul solicitado */
color: white;
border: none;
border-radius: 8px;
font-size: 1rem;
font-weight: bold;
cursor: pointer;
margin-top: 10px;
transition: background-color 0.3s;
}

button.btn-submit:hover {
background-color: #1d4ed8;
}

.footer-link {
margin-top: 20px;
font-size: 0.9rem;
color: #aaa;
}

.footer-link a {
color: #4ade80;
text-decoration: none;
font-weight: bold;
}

.footer-link a:hover {
text-decoration: underline;
}
</style>
</head>
<body>

<div class="card">
<h2>Login</h2>
<form id="loginForm">
<div class="input-group">
<label for="nome">Nome</label>
<input type="text" id="nome" name="nome" required>
</div>

<div class="input-group">
<label for="senha">Senha</label>
<input type="password" id="senha" name="senha" required>
</div>

<button type="submit" class="btn-submit">Enviar</button>
</form>

<div class="footer-link">
Ainda não possuo cadastro? <a href="escolha.html" class="btn-cadastre-se">Crie sua conta </a>

</div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const nome = document.getElementById("nome").value;
    const senha = document.getElementById("senha").value;

    // salva dados
    localStorage.setItem("empresaNome", nome || "Empresa");
    localStorage.setItem("empresaCNPJ", "12.345.678/0001-90");
    localStorage.setItem("empresaStatus", "ativa");

    // 🔥 AQUI VOCÊ REDIRECIONA PRA SEGUNDA PÁGINA
    window.location.href = "numero2.html";
});
</script>
</body>
</html>
