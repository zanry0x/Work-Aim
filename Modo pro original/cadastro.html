<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro | Vagas de Emprego</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
min-height: 100vh;
padding: 2rem 0;
}

.cadastro-container {
max-width: 800px;
margin: 0 auto;
background: white;
border-radius: 12px;
box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
overflow: hidden;
}

.cadastro-header {
background: linear-gradient(135deg, #4CAF50, #2E7D32);
color: white;
padding: 2rem;
text-align: center;
}

.cadastro-title {
font-size: 2rem;
margin-bottom: 0.5rem;
}

.cadastro-content {
padding: 2rem;
}

.form-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 1.5rem;
}

.form-group {
margin-bottom: 1.5rem;
}

.form-group.full-width {
grid-column: 1 / -1;
}

.form-label {
display: block;
margin-bottom: 0.5rem;
font-weight: 500;
color: #333;
}

.form-input {
width: 100%;
padding: 12px 15px;
border: 1px solid #ddd;
border-radius: 6px;
font-size: 1rem;
transition: all 0.3s;
}

.form-input:focus {
outline: none;
border-color: #4CAF50;
box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.2);
}

.form-select {
width: 100%;
padding: 12px 15px;
border: 1px solid #ddd;
border-radius: 6px;
font-size: 1rem;
background: white;
}

.btn-submit {
display: block;
width: 100%;
padding: 14px;
background: #4CAF50;
border: none;
border-radius: 6px;
color: white;
font-size: 1rem;
font-weight: bold;
cursor: pointer;
transition: all 0.3s;
margin-top: 1rem;
}

.btn-submit:hover {
background: #2E7D32;
}

@media (max-width: 768px) {
.form-grid {
grid-template-columns: 1fr;
}
}
</style>
</head>
<body>
<div class="cadastro-container">
<div class="cadastro-header">
<h1 class="cadastro-title">Cadastro</h1>
<p>Preencha os campos abaixo para criar sua conta</p>
</div>
<div class="cadastro-content">
<form id="cadastroForm">
<div class="form-grid">
<div class="form-group">
<label for="nome" class="form-label">Nome completo</label>
<input type="text" id="nome" class="form-input" required>
</div>
<div class="form-group">
<label for="email" class="form-label">E-mail</label>
<input type="email" id="email" class="form-input" required>
</div>
<div class="form-group">
<label for="cpf" class="form-label">CPF</label>
<input type="text" id="cpf" class="form-input" required>
</div>
<div class="form-group">
<label for="telefone" class="form-label">Telefone</label>
<input type="tel" id="telefone" class="form-input" required>
</div>
<div class="form-group">
<label for="senha" class="form-label">Senha</label>
<input type="password" id="senha" class="form-input" required>
</div>
<div class="form-group">
<label for="confirmar-senha" class="form-label">Confirmar senha</label>
<input type="password" id="confirmar-senha" class="form-input" required>
</div>
<div class="form-group">
<label for="data-nascimento" class="form-label">Data de nascimento</label>
<input type="date" id="data-nascimento" class="form-input" required>
</div>
<div class="form-group">
<label for="genero" class="form-label">Gênero</label>
<select id="genero" class="form-select" required>
<option value="" disabled selected>Selecione</option>
<option value="masculino">Masculino</option>
<option value="feminino">Feminino</option>
<option value="outro">Outro</option>
<option value="nao-informar">Prefiro não informar</option>
</select>
</div>
<div class="form-group full-width">
<label for="endereco" class="form-label">Endereço completo</label>
<input type="text" id="endereco" class="form-input" required>
</div>
<div class="form-group">
<label for="cidade" class="form-label">Cidade</label>
<input type="text" id="cidade" class="form-input" required>
</div>
<div class="form-group">
<label for="estado" class="form-label">Estado</label>
<select id="estado" class="form-select" required>
<option value="" disabled selected>Selecione</option>
<!-- Aqui viriam os estados brasileiros -->
</select>
</div>
<div class="form-group">
<label for="cep" class="form-label">CEP</label>
<input type="text" id="cep" class="form-input" required>
</div>
</div>
<button type="submit" class="btn-submit">Cadastrar</button>
</form>
</div>
</div>

<script>
// Preenchimento de estados (simplificado)
const estados = [
"Acre", "Alagoas", "Amapá", "Amazonas", "Bahia", "Ceará",
"Distrito Federal", "Espírito Santo", "Goiás", "Maranhão",
"Mato Grosso", "Mato Grosso do Sul", "Minas Gerais", "Pará",
"Paraíba", "Paraná", "Pernambuco", "Piauí", "Rio de Janeiro",
"Rio Grande do Norte", "Rio Grande do Sul", "Rondônia", "Roraima",
"Santa Catarina", "São Paulo", "Sergipe", "Tocantins"
];

const estadoSelect = document.getElementById('estado');
estados.forEach(estado => {
const option = document.createElement('option');
option.value = estado;
option.textContent = estado;
estadoSelect.appendChild(option);
});

// Máscara para CPF
document.getElementById('cpf').addEventListener('input', function(e) {
let value = e.target.value.replace(/\D/g, '');
if (value.length > 11) value = value.slice(0, 11);
value = value.replace(/(\d{3})(\d)/, '$1.$2');
value = value.replace(/(\d{3})(\d)/, '$1.$2');
value = value.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
e.target.value = value;
});

// Máscara para telefone
document.getElementById('telefone').addEventListener('input', function(e) {
let value = e.target.value.replace(/\D/g, '');
if (value.length > 11) value = value.slice(0, 11);
if (value.length > 2) {
value = value.replace(/(\d{2})(\d)/, '($1) $2');
}
if (value.length > 7) {
value = value.replace(/(\d{5})(\d)/, '$1-$2');
}
e.target.value = value;
});

// Máscara para CEP
document.getElementById('cep').addEventListener('input', function(e) {
let value = e.target.value.replace(/\D/g, '');
if (value.length > 8) value = value.slice(0, 8);
value = value.replace(/(\d{5})(\d)/, '$1-$2');
e.target.value = value;
});

document.getElementById('cadastroForm').addEventListener('submit', function(e) {
e.preventDefault();
const dados = {
nome: document.getElementById('nome').value,
email: document.getElementById('email').value,
cpf: document.getElementById('cpf').value,
telefone: document.getElementById('telefone').value,
senha: document.getElementById('senha').value,
confirmarSenha: document.getElementById('confirmar-senha').value,
dataNascimento: document.getElementById('data-nascimento').value,
genero: document.getElementById('genero').value,
endereco: document.getElementById('endereco').value,
cidade: document.getElementById('cidade').value,
estado: document.getElementById('estado').value,
cep: document.getElementById('cep').value
};

console.log('Dados do cadastro:', dados);
// Aqui conectaria com o backend depois

alert('Cadastro realizado com sucesso!');
window.location.href = 'login.html';
});
</script>
</body>
</html>
