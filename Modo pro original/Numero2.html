<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel da Empresa</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    display: flex;
    background: #0f172a;
    color: white;
}

/* SIDEBAR */
.sidebar {
    width: 250px;
    height: 100vh;
    background: #020617;
    padding: 20px;
}

.sidebar h2 {
    margin-bottom: 30px;
    color: #4ade80;
}

.menu {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.menu button {
    background: none;
    border: none;
    color: #cbd5f5;
    text-align: left;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
}

.menu button:hover {
    background: #1e293b;
}

/* MAIN */
.main {
    flex: 1;
}

/* HEADER */
.header {
    background: #020617;
    padding: 15px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.perfil {
    display: flex;
    align-items: center;
    gap: 15px;
}

.perfil img {
    width: 45px;
    border-radius: 50%;
}

.info p {
    font-size: 0.8rem;
    color: #94a3b8;
}

/* STATUS */
.status {
    padding: 8px 15px;
    border-radius: 20px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.ativa {
    background: #16a34a;
}

.inativa {
    background: #dc2626;
}

/* CONTAINER */
.container {
    padding: 40px;
}

/* CARDS */
.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
}

.card {
    background: #1e293b;
    padding: 25px;
    border-radius: 15px;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
}

/* BOTÕES */
.actions {
    margin-top: 40px;
    display: flex;
    gap: 20px;
}

.btn {
    flex: 1;
    padding: 25px;
    border-radius: 15px;
    font-size: 1.2rem;
    border: none;
    cursor: pointer;
    color: white;
    transition: 0.3s;
}

.btn-vaga {
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
}

.btn-radar {
    background: linear-gradient(135deg, #9333ea, #7e22ce);
}

.btn:hover {
    transform: scale(1.05);
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h2>💼 Vagas</h2>

    <div class="menu">
        <button>🏠 Dashboard</button>
        <button>📄 Minhas Vagas</button>
        <button>📡 Radar</button>
        <button>⚙️ Configurações</button>
    </div>
</div>

<!-- MAIN -->
<div class="main">

    <!-- HEADER -->
    <div class="header">
        <div class="perfil">
            <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png">

            <div class="info">
                <h3 id="nomeEmpresa"></h3>
                <p id="cnpjEmpresa"></p>
            </div>
        </div>

        <div id="statusEmpresa" class="status"></div>
    </div>

    <!-- CONTEÚDO -->
    <div class="container">

        <!-- CARDS -->
        <div class="cards">
            <div class="card">
                <h3>📊 Vagas Ativas</h3>
                <p>12 vagas abertas</p>
            </div>

            <div class="card">
                <h3>👥 Candidatos</h3>
                <p>34 candidatos encontrados</p>
            </div>

            <div class="card">
                <h3>⭐ Destaque</h3>
                <p>Sua empresa está em alta</p>
            </div>
        </div>

        <!-- AÇÕES -->
        <div class="actions">
            <button class="btn btn-vaga" onclick="adicionarVaga()">
                ➕ Adicionar Vaga
            </button>

            <button class="btn btn-radar" onclick="abrirRadar()">
                📡 Radar de Trabalhadores
            </button>
        </div>

    </div>
</div>

<script>
// DADOS
const nome = localStorage.getItem("empresaNome") || "Empresa Exemplo";
const cnpj = localStorage.getItem("empresaCNPJ") || "00.000.000/0001-00";
let status = localStorage.getItem("empresaStatus") || "ativa";

document.getElementById("nomeEmpresa").innerText = nome;
document.getElementById("cnpjEmpresa").innerText = cnpj;

const statusEl = document.getElementById("statusEmpresa");

// ATUALIZAR STATUS
function atualizarStatus() {
    statusEl.classList.remove("ativa", "inativa");

    if (status === "ativa") {
        statusEl.innerText = "🟢 Ativa (clique)";
        statusEl.classList.add("ativa");
    } else {
        statusEl.innerText = "🔴 Inativa (clique)";
        statusEl.classList.add("inativa");
    }

    localStorage.setItem("empresaStatus", status);
}

// TOGGLE STATUS
statusEl.addEventListener("click", () => {
    status = status === "ativa" ? "inativa" : "ativa";
    atualizarStatus();
});

// INICIALIZA
atualizarStatus();

// BOTÕES
function adicionarVaga() {
    alert("Aqui você vai abrir a tela de cadastro de vagas");
}

function abrirRadar() {
    alert("Aqui vai o radar de trabalhadores");
}
</script>

</body>
</html>
