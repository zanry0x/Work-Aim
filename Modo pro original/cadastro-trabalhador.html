<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Currículo | Editor Completo</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --main-bg: #f8fafc;
            --accent: #f97316; 
            --text-dark: #1e293b;
            --text-sub: #64748b;
            --border: #e2e8f0;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body { 
            background-color: var(--main-bg); 
            color: var(--text-dark);
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container { width: 100%; max-width: 900px; }

        .page-header { margin-bottom: 40px; text-align: left; }
        .page-header h1 { font-size: 2.2rem; color: var(--text-dark); }
        .page-header h1 span { color: var(--accent); }
        .page-header p { color: var(--text-sub); margin-top: 8px; }

        .card {
            background: var(--white);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
            margin-bottom: 30px;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 25px;
            color: var(--text-dark);
            border-left: 4px solid var(--accent);
            padding-left: 15px;
        }

        .form-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 20px; 
        }
        .full-width { grid-column: span 2; }

        .field { display: flex; flex-direction: column; gap: 8px; position: relative; }
        
        label { 
            font-size: 0.85rem; 
            font-weight: 700; 
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        
        input, select, textarea {
            width: 100%; 
            padding: 14px; 
            border: 1.5px solid var(--border); 
            border-radius: 12px; 
            font-size: 1rem; 
            transition: all 0.3s ease;
            background: #fdfdfd;
        }

        input:focus, select:focus, textarea:focus { 
            outline: none; 
            border-color: var(--accent); 
            background: white;
            box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.1); 
        }

        /* Estilo para o Olhinho da Senha */
        .password-wrapper { position: relative; }
        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-sub);
            display: flex;
            align-items: center;
        }

        .skill-input-group { display: flex; gap: 10px; }
        .btn-inline-add {
            background: var(--text-dark); color: white; border: none;
            padding: 0 20px; border-radius: 12px; cursor: pointer;
            font-weight: 600; transition: 0.2s;
        }
        .btn-inline-add:hover { background: #000; }

        .suggestions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .suggestion-tag {
            font-size: 0.75rem; background: #f1f5f9; color: var(--text-sub);
            padding: 5px 12px; border-radius: 20px; cursor: pointer;
            border: 1px solid var(--border); transition: 0.2s;
        }
        .suggestion-tag:hover { background: var(--accent); color: white; border-color: var(--accent); }

        .dynamic-item {
            background: #fcfcfc; border: 1px dashed var(--border);
            border-radius: 16px; padding: 25px; margin-bottom: 20px;
            position: relative; animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .btn-remove {
            position: absolute; top: -10px; right: -10px; 
            background: #ef4444; color: white; border: none; 
            width: 32px; height: 32px; border-radius: 50%; 
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            z-index: 10;
        }

        .btn-add {
            background: #fff; color: var(--accent); border: 2px dashed var(--accent);
            width: 100%; padding: 16px; border-radius: 14px; cursor: pointer; 
            font-weight: 700; display: flex; align-items: center; justify-content: center; 
            gap: 10px; transition: 0.2s;
        }
        .btn-add:hover { background: var(--accent); color: white; }

        .skills-container { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
        .skill-tag {
            background: var(--text-dark); color: white; padding: 8px 16px; border-radius: 10px; 
            font-size: 0.9rem; display: flex; align-items: center; gap: 10px;
        }
        .skill-tag span { cursor: pointer; font-size: 1.2rem; line-height: 1; color: var(--accent); }

        .actions { display: flex; justify-content: flex-end; gap: 15px; margin-top: 20px; }

        .btn-save {
            background: var(--accent); color: white; border: none; padding: 18px 40px; 
            border-radius: 14px; font-weight: 700; font-size: 1.1rem; cursor: pointer; 
            box-shadow: 0 10px 20px rgba(249, 115, 22, 0.3); display: flex; align-items: center; gap: 12px;
            transition: 0.3s;
        }
        .btn-save:hover { transform: translateY(-2px); }
        .btn-save:disabled { background: #cbd5e1; cursor: not-allowed; box-shadow: none; }

        @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } .full-width { grid-column: span 1; } }
    </style>
</head>
<body>

<div class="container">
    <header class="page-header">
        <h1>Vamos começar com seus <span>dados pessoais</span></h1>
        <p>Preencha todas as informações para salvar seu currículo.</p>
    </header>

    <form id="cvForm">
        <div class="card">
            <div class="section-title"><i data-lucide="user"></i> Informações de Contato</div>
            <div class="form-grid">
                <div class="field full-width">
                    <label>Nome Completo</label>
                    <input type="text" id="userName" required placeholder="Ex: Alessandra Moraes">
                </div>
                <div class="field">
                    <label>E-mail</label>
                    <input type="email" id="userEmail" required placeholder="felipe.@gmail.com">
                </div>
                <div class="field">
                    <label>Crie uma Senha (mín. 6 dígitos)</label>
                    <div class="password-wrapper">
                        <input type="password" id="userPassword" required placeholder="******" minlength="6">
                        <span class="toggle-password" onclick="togglePasswordVisibility()">
                            <i id="eyeIcon" data-lucide="eye"></i>
                        </span>
                    </div>
                </div>
                <div class="field">
                    <label>Número de Telefone</label>
                    <input type="text" id="userTel" required placeholder="(00) 00000-0000" maxlength="15">
                </div>
                <div class="field">
                    <label>CEP</label>
                    <input type="text" id="userCep" required placeholder="00000-000" maxlength="9">
                </div>
                <div class="field">
                    <label>Cidade / Estado</label>
                    <input type="text" id="userCity" required placeholder="Ex: São Paulo - SP">
                </div>
                <div class="field full-width">
                    <label>Endereço (Rua e Número)</label>
                    <input type="text" id="userAddress" required placeholder="Ex: Rua Gandavo, 500">
                </div>
                <div class="field">
                    <label>Nacionalidade</label>
                    <input type="text" id="userNac" required placeholder="Ex: Brasileira">
                </div>
                <div class="field">
                    <label>LinkedIn / Portfolio (Link)</label>
                    <input type="text" id="userLinks" placeholder="linkedin.com/in/perfil">
                </div>
            </div>
        </div>

        <div class="card">
            <div class="section-title"><i data-lucide="target"></i> Objetivo Profissional</div>
            <div class="field">
                <textarea id="objetivo" required rows="4" placeholder="Sua meta profissional..."></textarea>
            </div>
        </div>

        <div class="card">
            <div class="section-title"><i data-lucide="graduation-cap"></i> Formação Acadêmica</div>
            <div id="formacaoContainer"></div>
            <button type="button" class="btn-add" onclick="addFormacao()"><i data-lucide="plus"></i> Adicionar Formação</button>
        </div>

        <div class="card">
            <div class="section-title"><i data-lucide="briefcase"></i> Experiência Profissional</div>
            <div id="experienciaContainer"></div>
            <button type="button" class="btn-add" onclick="addExperiencia()"><i data-lucide="plus"></i> Adicionar Experiência</button>
        </div>

        <div class="card">
            <div class="section-title"><i data-lucide="zap"></i> Habilidades & Competências</div>
            <div class="field">
                <div class="skill-input-group">
                    <input type="text" id="skillInput" placeholder="Ex: Pacote Office" onkeypress="handleSkill(event)">
                    <button type="button" class="btn-inline-add" onclick="addSkillManual()">Adicionar</button>
                </div>
            </div>
            <div class="suggestions">
                <span class="suggestion-tag" onclick="addSkillFromTag('Trabalho em Equipe')">+ Trabalho em Equipe</span>
                <span class="suggestion-tag" onclick="addSkillFromTag('Liderança')">+ Liderança</span>
                <span class="suggestion-tag" onclick="addSkillFromTag('Proatividade')">+ Proatividade</span>
            </div>
            <div class="skills-container" id="skillsList"></div>
        </div>

        <div class="card">
            <div class="section-title"><i data-lucide="award"></i> Certificados (Opcional)</div>
            <div id="certificadoContainer"></div>
            <button type="button" class="btn-add" onclick="addCertificado()"><i data-lucide="plus"></i> Adicionar Certificado</button>
        </div>

        <div class="actions">
            <button type="button" class="btn-save" onclick="saveCV()">
                <i data-lucide="check-circle"></i> Fazer Cadastro
            </button>
        </div>
    </form>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

<script>
    lucide.createIcons();

    const firebaseConfig = { 
        apiKey: "AIzaSyC3B5WcBUQIY1iuwJ5sKmgvivA8O-rG7z0",
        authDomain: "meuportaldevagas.firebaseapp.com",
        projectId: "meuportaldevagas",
        storageBucket: "meuportaldevagas.firebasestorage.app",
        messagingSenderId: "77991933793",
        appId: "1:77991933793:web:2e8df544915ce3dc463720",
        measurementId: "G-JMEWXD1DYW" 
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    function togglePasswordVisibility() {
        const passwordInput = document.getElementById('userPassword');
        const eyeIcon = document.getElementById('eyeIcon');
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            eyeIcon.setAttribute('data-lucide', 'eye-off');
        } else {
            passwordInput.type = 'password';
            eyeIcon.setAttribute('data-lucide', 'eye');
        }
        lucide.createIcons();
    }

    const handlePhone = (event) => {
        let input = event.target;
        let value = input.value.replace(/\D/g, "");
        if (value.length > 11) value = value.slice(0, 11);
        if (value.length > 10) { value = value.replace(/^(\d{2})(\d{5})(\d{4}).*/, "($1) $2-$3"); } 
        else if (value.length > 6) { value = value.replace(/^(\d{2})(\d{4})(\d{0,4}).*/, "($1) $2-$3"); } 
        else if (value.length > 2) { value = value.replace(/^(\d{2})(\d{0,5})/, "($1) $2"); } 
        else if (value.length > 0) { value = value.replace(/^(\d*)/, "($1"); }
        input.value = value;
    };
    document.getElementById('userTel').addEventListener('input', handlePhone);

    const cepInput = document.getElementById('userCep');
    cepInput.addEventListener('blur', async () => {
        let cep = cepInput.value.replace(/\D/g, '');
        if (cep.length === 8) {
            try {
                const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                const data = await response.json();
                if (!data.erro) {
                    document.getElementById('userAddress').value = data.logradouro;
                    document.getElementById('userCity').value = `${data.localidade} - ${data.uf}`;
                    cepInput.value = cep.replace(/^(\d{5})(\d{3})/, "$1-$2");
                }
            } catch (e) { console.error("Erro ao buscar CEP"); }
        }
    });

    let skills = [];
    function addSkillManual() {
        const input = document.getElementById('skillInput');
        const val = input.value.trim();
        if (val && !skills.includes(val)) { skills.push(val); renderSkills(); }
        input.value = "";
    }
    function handleSkill(e) { if (e.key === 'Enter') { e.preventDefault(); addSkillManual(); } }
    function addSkillFromTag(skillName) { if (!skills.includes(skillName)) { skills.push(skillName); renderSkills(); } }
    function renderSkills() {
        const list = document.getElementById('skillsList');
        list.innerHTML = skills.map((s, i) => `<div class="skill-tag">${s} <span onclick="removeSkill(${i})">&times;</span></div>`).join('');
    }
    function removeSkill(i) { skills.splice(i, 1); renderSkills(); }

    function addFormacao() {
        const html = `
            <div class="dynamic-item formacao-item">
                <button type="button" class="btn-remove" onclick="this.parentElement.remove()"><i data-lucide="x"></i></button>
                <div class="form-grid">
                    <div class="field"><label>Nível de Ensino</label><select required class="f-nivel"><option value="" disabled selected>Selecione...</option><option>Ensino Fundamental</option><option>Ensino Médio</option><option>Ensino Técnico</option><option>Ensino Superior (Graduação)</option><option>Pós-Graduação (Especialização)</option></select></div>
                    <div class="field"><label>Curso</label><input type="text" class="f-curso" required></div>
                    <div class="field"><label>Instituição</label><input type="text" class="f-inst" required></div>
                    <div class="field"><label>Status</label><select class="f-status"><option>Concluído</option><option>Cursando</option></select></div>
                    <div class="field"><label>Início</label><input type="date" class="f-ini" required></div>
                    <div class="field"><label>Fim</label><input type="date" class="f-fim" required></div>
                </div>
            </div>`;
        document.getElementById('formacaoContainer').insertAdjacentHTML('beforeend', html);
        lucide.createIcons();
    }

    function addExperiencia() {
        const html = `
            <div class="dynamic-item exp-item">
                <button type="button" class="btn-remove" onclick="this.parentElement.remove()"><i data-lucide="x"></i></button>
                <div class="form-grid">
                    <div class="field"><label>Cargo</label><input type="text" class="e-cargo" required></div>
                    <div class="field"><label>Empresa</label><input type="text" class="e-emp" required></div>
                    <div class="field"><label>Início</label><input type="date" class="e-ini" required></div>
                    <div class="field"><label>Término</label><input type="date" class="e-fim" required></div>
                    <div class="field full-width"><label>Atividades</label><textarea class="e-desc" rows="2" required></textarea></div>
                </div>
            </div>`;
        document.getElementById('experienciaContainer').insertAdjacentHTML('beforeend', html);
        lucide.createIcons();
    }

    function addCertificado() {
        const html = `
            <div class="dynamic-item cert-item">
                <button type="button" class="btn-remove" onclick="this.parentElement.remove()"><i data-lucide="x"></i></button>
                <div class="form-grid">
                    <div class="field full-width"><label>Certificado</label><input type="text" class="c-nome"></div>
                    <div class="field"><label>Instituição</label><input type="text" class="c-inst"></div>
                    <div class="field"><label>Data</label><input type="date" class="c-data"></div>
                </div>
            </div>`;
        document.getElementById('certificadoContainer').insertAdjacentHTML('beforeend', html);
        lucide.createIcons();
    }

    async function saveCV() {
        const btn = document.querySelector('.btn-save');
        const nomePessoa = document.getElementById('userName').value.trim();
        const email = document.getElementById('userEmail').value.trim();
        const senha = document.getElementById('userPassword').value;

        if(!nomePessoa || !email || senha.length < 6) {
            alert("Preencha o nome, e-mail e uma senha de no mínimo 6 dígitos.");
            return;
        }

        try {
            btn.innerText = "Criando conta...";
            btn.disabled = true;

            const userCredential = await auth.createUserWithEmailAndPassword(email, senha);
            const user = userCredential.user;

            const formacoes = Array.from(document.querySelectorAll('.formacao-item')).map(item => ({
                nivel: item.querySelector('.f-nivel').value,
                curso: item.querySelector('.f-curso').value,
                inst: item.querySelector('.f-inst').value,
                status: item.querySelector('.f-status').value,
                inicio: item.querySelector('.f-ini').value,
                fim: item.querySelector('.f-fim').value
            }));

            const experiencias = Array.from(document.querySelectorAll('.exp-item')).map(item => ({
                cargo: item.querySelector('.e-cargo').value,
                empresa: item.querySelector('.e-emp').value,
                inicio: item.querySelector('.e-ini').value,
                fim: item.querySelector('.e-fim').value,
                desc: item.querySelector('.e-desc').value
            }));

            const certificados = Array.from(document.querySelectorAll('.cert-item')).map(item => ({
                nome: item.querySelector('.c-nome').value,
                inst: item.querySelector('.c-inst').value,
                data: item.querySelector('.c-data').value
            }));

            const cvData = {
                uid: user.uid,
                dados_pessoais: {
                    nome: nomePessoa,
                    telefone: document.getElementById('userTel').value,
                    email: email,
                    cep: document.getElementById('userCep').value,
                    cidade_estado: document.getElementById('userCity').value,
                    endereco: document.getElementById('userAddress').value,
                    nacionalidade: document.getElementById('userNac').value,
                    linkedin: document.getElementById('userLinks').value || "N/A"
                },
                objetivo: document.getElementById('objetivo').value,
                habilidades: skills,
                formacoes: formacoes,
                experiencias: experiencias,
                certificados: certificados,
                data_cadastro: new Date().toLocaleString("pt-BR")
            };

            // Alterado para usar o nomePessoa como ID do documento
            await db.collection("Trabalhadores").doc(nomePessoa).set(cvData);
            
            alert("✅ Cadastro realizado com sucesso! Redirecionando para o login...");
            window.location.href = "login.html";

        } catch (e) {
            console.error(e);
            alert("Erro: " + e.message);
            btn.disabled = false;
            btn.innerText = "Fazer Cadastro";
        }
    }
</script>

</body>
</html>
