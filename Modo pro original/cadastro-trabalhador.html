margin-bottom: 0.5rem;

.form-label {

}

.input-wrapper {
position: relative;
display: flex;
align-items: center;
}

.input-wrapper input {
padding-right: 45px; /* Espaço para o ícone */
}

.toggle-password {
position: absolute;
right: 15px;
cursor: pointer;
color: #666;

}

.toggle-password:hover {
color: #4CAF50;
}

.form-input:focus {
outline: none;
border-color: #4CAF50;
box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.2);
}

.form-select {
width: 100%;
padding: 12px 15px;
border: 1px solid #ddd;
border-radius: 6px;
font-size: 1rem;
background: white;
}

/* Estilos das Experiências Dinâmicas */
.experiencias-area {
background: #f9fbfd;
border: 1px solid #e1e4e8;
border-radius: 8px;
padding: 1.5rem;
margin-top: 1rem;
}

.exp-item {
background: white;
border: 1px solid #ddd;
padding: 1rem;
border-radius: 6px;
margin-bottom: 1rem;
position: relative;
animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
from { opacity: 0; transform: translateY(-10px); }
to { opacity: 1; transform: translateY(0); }
}

.btn-remove-exp {
position: absolute;
top: 10px;
right: 10px;
background: #ff4d4d;
color: white;
border: none;
width: 30px;
height: 30px;
border-radius: 50%;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
font-size: 0.9rem;
transition: 0.2s;
}

.btn-remove-exp:hover {
background: #cc0000;
}

.btn-add-exp {
background: #fff;
border: 2px dashed #4CAF50;
color: #4CAF50;
padding: 10px 20px;
border-radius: 6px;
cursor: pointer;
font-weight: 600;
display: flex;
align-items: center;
gap: 8px;
transition: 0.3s;
width: 100%;
justify-content: center;
}

.btn-add-exp:hover {
background: #e8f5e9;
}

.btn-submit {
display: block;
width: 100%;
padding: 14px;
background: #4CAF50;
border: none;
border-radius: 6px;
color: white;
font-size: 1.1rem;
font-weight: bold;
cursor: pointer;
transition: all 0.3s;
margin-top: 2rem;
}

.btn-submit:hover {
background: #2E7D32;
transform: translateY(-2px);
}

@media (max-width: 768px) {
.form-grid {
grid-template-columns: 1fr;
}
.cadastro-container {
margin: 0 1rem;
}
}
</style>
</head>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Cadastro completo de trabalhador para vagas de emprego">
<meta name="keywords" content="cadastro, trabalhador, emprego, vagas, profissional">
<meta name="robots" content="index">
<title>Cadastro Trabalhador | Vagas Online</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
body { background: linear-gradient(135deg, #f5f7fa, #c3cfe2); min-height: 100vh; padding: 2rem 0; }
.cadastro-container { max-width: 800px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); overflow: hidden; }
.cadastro-header { background: linear-gradient(135deg, #4CAF50, #2E7D32); color: white; padding: 2rem; text-align: center; }
.cadastro-title { font-size: 2rem; margin-bottom: 0.5rem; }
.cadastro-content { padding: 2rem; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
.form-group { margin-bottom: 1.5rem; }
.form-group.full-width { grid-column: 1/-1; }
.form-label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: #333; font-size: 0.9rem; }
.form-input { width: 100%; padding: 12px 15px; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; transition: all 0.3s; }
.form-input:focus { outline: none; border-color: #4CAF50; box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.2); }
.form-select { width: 100%; padding: 12px 15px; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; background: white; }
.btn-submit { display: block; width: 100%; padding: 14px; background: #4CAF50; border: none; border-radius: 6px; color: white; font-size: 1rem; font-weight: bold; cursor: pointer; transition: all 0.3s; margin-top: 1rem; }
.btn-submit:hover { background: #2E7D32; }
.icon-eye { position: absolute; right: 15px; top: 14px; color: #888; cursor: pointer; }
.btn-add-exp { width: 100%; padding: 12px; background: #4CAF50; border: none; border-radius: 6px; color: white; font-size: 1rem; margin-top: 2rem; cursor: pointer; }
.btn-add-exp:hover { background: #2E7D32; }
.exp-item { border: 1px solid #ddd; border-radius: 6px; padding: 1rem; margin-top: 1rem; position: relative; background: #f9fafb; }
.btn-remove-exp { position: absolute; top: 5px; right: 5px; background: #ef4444; color: white; border: none; width: 25px; height: 25px; border-radius: 50%; cursor: pointer; }
.btn-remove-exp:hover { background: #dc2626; }
.datList { max-height: 200px; overflow-y: auto; }
@media (max-width: 768px) {.form-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="cadastro-container">
<header class="cadastro-header">
<h1 class="cadastro-title">Cadastro Trabalhador</h1>
<p>Preencha seus dados para encontrar as melhores vagas</p>
</header>
<main class="cadastro-content">
<form id="cadastroForm" novalidate>
<!-- Nome, Email -->
<div class="form-grid">
<div class="form-group">
<label for="nome" class="form-label">Nome completo*</label>
<input type="text" id="nome" class="form-input" required>
</div>
<div class="form-group">
<label for="email" class="form-label">E-mail*</label>
<input type="email" id="email" class="form-input" required>
</div>
</div>

<!-- CPF, Telefone -->
<div class="form-grid">
<div class="form-group">
<label for="cpf" class="form-label">CPF*</label>
<input type="text" id="cpf" class="form-input" placeholder="000.000.000-00" maxlength="14" required>
</div>
<div class="form-group">
<label for="telefone" class="form-label">Telefone*</label>
<input type="tel" id="telefone" class="form-input" placeholder="(00) 00000-0000" maxlength="15" required>
</div>
</div>

<!-- Senha -->
<div class="form-group">
<label for="senha" class="form-label">Senha*</label>
<input type="password" id="senha" class="form-input" required>
<i class="fas fa-eye-slash icon-eye" id="togglePassword"></i>
</div>

<!-- Confirmar Senha -->
<div class="form-group">
<label for="confirmar-senha" class="form-label">Confirmar senha*</label>
<input type="password" id="confirmar-senha" class="form-input" required>
<i class="fas fa-eye-slash icon-eye" id="toggleConfirmarPassword"></i>
</div>

<!-- Data Nascimento -->
<div class="form-group">
<label for="data-nascimento" class="form-label">Data de nascimento*</label>
<input type="date" id="data-nascimento" class="form-input" required>
</div>

<!-- Gênero -->
<div class="form-group">
<label for="genero" class="form-label">Gênero*</label>
<select id="genero" class="form-select" required>
<option value="" disabled selected>Selecione</option>
<option>Masculino</option>
<option>Feminino</option>
<option>Outro</option>
<option>Prefiro não informar</option>
</select>
</div>

<!-- Cidade -->
<div class="form-group">
<label for="cidade" class="form-label">Cidade de nascimento*</label>
<input type="text" id="cidade" class="form-input" required>
</div>

<!-- Endereço + CEP -->
<div class="form-group full-width">
<label for="endereco" class="form-label">Endereço completo*</label>
<input type="text" id="endereco" class="form-input" required>
</div>
<div class="form-grid">
<div class="form-group">
<label for="cep" class="form-label">CEP*</label>
<input type="text" id="cep" class="form-input" placeholder="00000-000" maxlength="9" required>
</div>
<div class="form-group">
<label for="estado" class="form-label">Estado*</label>
<select id="estado" class="form-select" required>
<option value="" disabled selected>Selecione um estado</option>
</select>
</div>
</div>

<!-- Sobre Mim -->
<div class="form-group full-width">
<label for="sobre-mim" class="form-label">Sobre você*</label>
<textarea id="sobre-mim" class="form-input" rows="3" placeholder="Conte um pouco da sua trajetória profissional e objetivos" required></textarea>
</div>

<!-- Profissão -->
<div class="form-group">
<label for="funcao" class="form-label">Profissão principal*</label>
<input type="text" id="funcao" class="form-input autocomplete" placeholder="Busque sua profissão" required>
<datalist id="profissoes"></datalist>
</div>

<!-- Experiências -->
<h3 style="margin: 1rem 0; color: #4CAF50;">Experiências Profissionais</h3>
<div id="experiencias-container"></div>
<button type="button" class="btn-add-exp" id="add-experiencia">+ Adicionar Experiência</button>

<button type="submit" class="btn-submit">Cadastrar Trabalhador</button>
</form>
</main>
</div>

<script>
const form = document.getElementById('cadastroForm');
const togglePassword = document.getElementById('togglePassword');
const toggleConfirmarPassword = document.getElementById('toggleConfirmarPassword');
const cpfInput = document.getElementById('cpf');
const telefoneInput = document.getElementById('telefone');
const cepInput = document.getElementById('cep');
const estados = ["Acre","Alagoas","Amapá","Amazonas","Bahia","Ceará","Distrito Federal","Espírito Santo","Goiás","Maranhão","Mato Grosso","Mato Grosso do Sul","Minas Gerais","Pará","Paraíba","Paraná","Pernambuco","Piauí","Rio de Janeiro","Rio Grande do Norte","Rio Grande do Sul","Rondônia","Roraima","Santa Catarina","São Paulo","Sergipe","Tocantins"];
const professios = [
"Administrador", "Advogado", "Analista de Dados", "Analista de Marketing", "Analista de RH",
"Analista de Sistemas", "Arquiteto", "Auxiliar Administrativo", "Azulejista", "Barbeiro",
"Biólogo", "Bombeiro Civil", "Cabeleireiro", "Carpinteiro", "Chefe de Cozinha", "Ciência da Computação",
"Cientista de Dados", "Contador", "Dentista", "Designer Gráfico", "Designer de UX/UI", "Eletricista",
"Enfermeiro", "Engenheiro Civil", "Engenheiro de Software", "Esteticista", "Farmacêutico",
"Gerente de Projetos", "Instalador Hidráulico", "Mecânico", "Médico", "Motorista", "Musico",
"Operador de Máquinas", "Pedreiro", "Personal Trainer", "Prof. de Educação Física", "Programador",
"Redes e Telecomunicações", "Secretária", "Técnico em Enfermagem", "Tecnólogo de Informação"
];

// Preenche Estados
const estadoSelect = document.getElementById('estado');
estados.forEach(e => {
const opt = document.createElement('option');
opt.value = e; opt.textContent = e;
estadoSelect.appendChild(opt);
});

// Preenche Profissoes
const funcaoInput = document.getElementById('funcao');
const datalist = document.getElementById('profissoes');
professios.forEach(p => {
const opt = document.createElement('option');
opt.value = p;
datalist.appendChild(opt);
});

// Funções de máscara
function aplicarMaskCPF(val) {
val = val.replace(/\D/g,'');
if (val.length > 11) val = val.substring(0,11);
val = val.replace(/(\d{3})(\d)/,'$1.$2');
val = val.replace(/(\d{3})(\d)/,'$1.$2');
val = val.replace(/(\d{3})(\d{1,2})$/,'$1-$2');
return val;
}

function aplicarMaskTelefone(val) {
val = val.replace(/\D/g,'');
if (val.length > 11) val = val.substring(0,11);
if (val.length > 2) val = val.replace(/(\d{2})(\d)/,'($1) $2');
if (val.length > 7) val = val.replace(/(\d{5})(\d)/,'$1-$2');
return val;
}

function aplicarMaskCEP(val) {
val = val.replace(/\D/g,'');
if (val.length > 8) val = val.substring(0,8);
val = val.replace(/(\d{5})(\d)/,'$1-$2');
return val;
}

// Eventos de máscara
cpfInput.addEventListener('input',(e)=>{
e.target.value = aplicarMaskCPF(e.target.value);
});

telefoneInput.addEventListener('input',(e)=>{
e.target.value = aplicarMaskTelefone(e.target.value);
});

cepInput.addEventListener('input',(e)=>{
e.target.value = aplicarMaskCEP(e.target.value);
});

// Toggle senha
togglePassword.addEventListener('click', () => {
const type = senha.getAttribute('type') === 'password'? 'text': 'password';
senha.setAttribute('type', type);
togglePassword.classList.toggle('fa-eye-slash'); togglePassword.classList.toggle('fa-eye');
});

toggleConfirmarPassword.addEventListener('click', () => {
const type = confirmarSenha.getAttribute('type') === 'password'? 'text': 'password';
confirmarSenha.setAttribute('type', type);
toggleConfirmarPassword.classList.toggle('fa-eye-slash'); toggleConfirmarPassword.classList.toggle('fa-eye');
});

// Experiências dinâmicas
const containerExp = document.getElementById('experiencias-container');
const btnAddExp = document.getElementById('add-experiencia');
let expIndex = 0;

btnAddExp.addEventListener('click', () => {
const expBox = document.createElement('div');
expBox.className = 'exp-item';
expBox.innerHTML = `
<button type="button" class="btn-remove-exp"><i class="fas fa-minus"></i></button>
<div class="form-group" style="margin-bottom:0.7rem;">
<label>Cargo / Função <strong>(${expIndex + 1})</strong></label>
<input type="text" name="exp-cargo-${expIndex}" class="form-input" placeholder="Front-end Developer" required>
</div>
<div class="form-grid">
<div class="form-group">
<label>Empresa</label>
<input type="text" name="exp-empresa-${expIndex}" class="form-input" placeholder="Empresa XYZ" required>
</div>
<div class="form-group">
<label>Ano Início</label>
<input type="number" name="exp-anoi-${expIndex}" class="form-input" min="1960" max="2026" placeholder="2020" required>
</div>
</div>
<div class="form-grid">
<div class="form-group">
<label>Ano Término</label>
<input type="number" name="exp-anof-${expIndex}" class="form-input" min="1960" max="2026" placeholder="2023">
</div>
<div class="form-group" style="margin-bottom:0;">
<label style="visibility:hidden">.</label>
<select name="exp-tipo-${expIndex}" class="form-select">
<option selected>TI</option><option>Saúde</option><option>Educação</option><option>Gestão</option><option>Outro</option>
</select>
</div>
</div>
`;
containerExp.prepend(expBox);
expIndex++;
const btnRemove = expBox.querySelector('.btn-remove-exp');
btnRemove.addEventListener('click', () => expBox.remove());
});

// Validação final e envio
form.addEventListener('submit', (e) => {
e.preventDefault();
const confirm = document.getElementById('confirmar-senha');
if (senha.value!== confirm.value) {
alert('Senhas não conferem!');
return;
}
const dados = {
nome: nome.value, email: email.value, cpf: cpfInput.value, telefone: telefoneInput.value,
senha: senha.value, confirmarSenha: confirm.value, dataNascimento: dataNascimento.value,
genero: genero.value, endereco: endereco.value, cidade: cidade.value,
estado: estado.value, cep: cepInput.value, sobreMim: sobreMim.value,
profissao: funcao.value
};
console.log('Dados para envio:', dados);
alert('Cadastro realizado com sucesso!');
window.location.href = 'login.html';
});
</script>
</body>
</html>
