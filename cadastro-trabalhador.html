<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cadastro</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>

<body>

<div class="container">

<!-- ESQUERDA -->
<div class="left">

  <div class="form-wrapper">

    <div class="header">
      <h1>Cadastrar-se</h1>
      <p>Já possui uma conta? <a href="#">Entrar</a></p>
    </div>

    <div class="card">

      <form id="cadastroForm">

        <input 
        type="text" 
        id="nome" 
        placeholder="Nome completo" 
        required
        >

        <input 
        type="email" 
        id="email" 
        placeholder="E-mail" 
        required
        >

        <!-- SENHA -->
        <div class="input-group">

          <input 
          type="password" 
          id="senha" 
          placeholder="Senha" 
          required
          >

          <i class="fas fa-eye toggle-password"
          onclick="toggleSenha('senha', this)">
          </i>

        </div>

        <!-- CONFIRMAR SENHA -->
        <div class="input-group">

          <input 
          type="password" 
          id="confirmarSenha" 
          placeholder="Confirmar senha" 
          required
          >

          <i class="fas fa-eye toggle-password"
          onclick="toggleSenha('confirmarSenha', this)">
          </i>

        </div>

        <!-- CPF -->
        <input 
        type="text" 
        id="cpf" 
        placeholder="CPF"
        maxlength="14"
        inputmode="numeric"
        required
        >

        <!-- TELEFONE -->
        <input 
        type="text" 
        id="telefone" 
        placeholder="Telefone" 
        maxlength="15" 
        inputmode="numeric"
        required
        >

        <!-- DATA -->
        <input 
        type="date" 
        id="dataNascimento" 
        required
        >

        <!-- GÊNERO -->
        <select id="genero" required>

          <option value="" disabled selected>
            Selecione o gênero
          </option>

          <option>Masculino</option>
          <option>Feminino</option>
          <option>Transgênero</option>
          <option>Não-binário</option>
          <option>Prefiro não informar</option>

        </select>

        <!-- CEP -->
        <input 
        type="text" 
        id="cep" 
        placeholder="CEP"
        maxlength="9"
        inputmode="numeric"
        required
        >

        <!-- ENDEREÇO -->
        <input 
        type="text" 
        id="endereco" 
        placeholder="Endereço" 
        required
        >

        <!-- ESTADO -->
        <select id="estado" required></select>

        <!-- CIDADE -->
        <select id="cidade" required></select>

        <!-- SOBRE -->
        <textarea 
        id="sobreMim" 
        placeholder="Sobre você">
        </textarea>

        <!-- PROFISSÃO -->
        <input 
        type="text" 
        id="funcao" 
        placeholder="Profissão"
        >

        <!-- BOTÃO -->
        <button type="submit">
          Cadastrar
        </button>

      </form>

    </div>

  </div>

</div>

<!-- DIREITA -->
<div class="right">

  <img src="WorkAim2.png" class="logo">

</div>

</div>

<script>

/* ================= TOGGLE SENHA ================= */

function toggleSenha(id, icon){

  const input = document.getElementById(id);

  input.type =
  input.type === "password"
  ? "text"
  : "password";

  icon.classList.toggle("fa-eye");
  icon.classList.toggle("fa-eye-slash");

}

/* ================= ESTADOS ================= */

const estados = {

"AC": "Acre",
"AL": "Alagoas",
"AP": "Amapá",
"AM": "Amazonas",
"BA": "Bahia",
"CE": "Ceará",
"ES": "Espírito Santo",
"GO": "Goiás",
"DF": "Distrito Federal",
"MA": "Maranhão",
"MT": "Mato Grosso",
"MS": "Mato Grosso do Sul",
"MG": "Minas Gerais",
"PA": "Pará",
"PB": "Paraíba",
"PR": "Paraná",
"PE": "Pernambuco",
"PI": "Piauí",
"RJ": "Rio de Janeiro",
"RN": "Rio Grande do Norte",
"RS": "Rio Grande do Sul",
"RO": "Rondônia",
"RR": "Roraima",
"SC": "Santa Catarina",
"SP": "São Paulo",
"SE": "Sergipe",
"TO": "Tocantins"

};

const estado = document.getElementById("estado");
const cidade = document.getElementById("cidade");

/* ================= PREENCHE ESTADOS ================= */

Object.entries(estados).forEach(([uf, nome]) => {

  let opt = document.createElement("option");

  opt.value = uf;
  opt.textContent = `${nome} (${uf})`;

  estado.appendChild(opt);

});

/* ================= CIDADES IBGE ================= */

async function carregarCidades(
  uf,
  cidadeSelecionada = null
){

  cidade.innerHTML =
  "<option>Carregando...</option>";

  try {

    const res = await fetch(
      `https://servicodados.ibge.gov.br/api/v1/localidades/estados/${uf}/municipios`
    );

    const data = await res.json();

    cidade.innerHTML = "";

    data.forEach(c => {

      let opt = document.createElement("option");

      opt.value = c.nome;
      opt.textContent = c.nome;

      cidade.appendChild(opt);

    });

    if(cidadeSelecionada){

      cidade.value = cidadeSelecionada;

    }

  }

  catch(erro){

    cidade.innerHTML =
    "<option>Erro ao carregar cidades</option>";

  }

}

/* ================= TROCA ESTADO ================= */

estado.addEventListener("change", () => {

  carregarCidades(estado.value);

});

/* ================= CPF ================= */

const cpf = document.getElementById("cpf");

cpf.addEventListener("input", (e) => {

  let valor =
  e.target.value.replace(/\D/g, "");

  valor =
  valor.replace(/(\d{3})(\d)/, "$1.$2");

  valor =
  valor.replace(/(\d{3})(\d)/, "$1.$2");

  valor =
  valor.replace(/(\d{3})(\d{1,2})$/, "$1-$2");

  e.target.value = valor;

});

/* ================= TELEFONE ================= */

const telefone =
document.getElementById("telefone");

telefone.addEventListener("input", (e) => {

  let valor =
  e.target.value.replace(/\D/g, "");

  valor =
  valor.replace(/(\d{2})(\d)/, "($1) $2");

  valor =
  valor.replace(/(\d{5})(\d)/, "$1-$2");

  e.target.value = valor;

});

/* ================= CEP ================= */

const cep = document.getElementById("cep");

cep.addEventListener("input", (e) => {

  let valor =
  e.target.value.replace(/\D/g, "");

  valor =
  valor.replace(/(\d{5})(\d)/, "$1-$2");

  e.target.value = valor;

});

/* ================= VIA CEP ================= */

cep.addEventListener("blur", async () => {

  let value =
  cep.value.replace("-", "");

  if(value.length !== 8) return;

  let res =
  await fetch(
    `https://viacep.com.br/ws/${value}/json/`
  );

  let data = await res.json();

  if(!data.erro){

    endereco.value = data.logradouro;

    estado.value = data.uf;

    await carregarCidades(
      data.uf,
      data.localidade
    );

  }

});

/* ================= VALIDAÇÃO ================= */

cadastroForm.addEventListener("submit", e => {

  e.preventDefault();

  if(senha.value !== confirmarSenha.value){

    alert("Senhas não conferem");
    return;

  }

  alert("Cadastro realizado com sucesso!");

});

</script>

</body>
</html>
