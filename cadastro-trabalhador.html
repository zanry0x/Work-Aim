<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cadastro</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>

<body>

<div class="container">

<!-- ESQUERDA -->
<div class="left">
  <div class="form-wrapper">

    <div class="header">
      <h1>Cadastrar-se</h1>
      <p>Já possui uma conta? <a href="#">Entrar</a></p>
    </div>

    <div class="card">

<form id="cadastroForm">

<input type="text" id="nome" placeholder="Nome completo" required>
<input type="email" id="email" placeholder="E-mail" required>

<div class="input-group">
<input type="password" id="senha" placeholder="Senha" required>
<i class="fas fa-eye toggle-password" onclick="toggleSenha('senha', this)"></i>
</div>

<div class="input-group">
<input type="password" id="confirmarSenha" placeholder="Confirmar senha" required>
<i class="fas fa-eye toggle-password" onclick="toggleSenha('confirmarSenha', this)"></i>
</div>

<input type="text" id="cpf" placeholder="CPF" maxlength="14" required>
<input type="text" id="telefone" placeholder="Telefone" maxlength="15" required>

<input type="date" id="dataNascimento" required>

<select id="genero" required>
<option value="" disabled selected>Selecione o gênero</option>
<option>Masculino</option>
<option>Feminino</option>
<option>Transgênero</option>
<option>Não-binário</option>
<option>Prefiro não informar</option>
</select>

<input type="text" id="cep" placeholder="CEP" maxlength="9" required>
<input type="text" id="endereco" placeholder="Endereço" required>

<select id="estado" required></select>
<select id="cidade" required></select>

<textarea id="sobreMim" placeholder="Sobre você"></textarea>

<input type="text" id="funcao" placeholder="Profissão">

<button type="submit">Cadastrar</button>

</form>

    </div>
  </div>
</div>

<!-- DIREITA -->
<div class="right">
  <img src="WorkAim2.png" class="logo">
</div>

</div>

<script>

/* ================= TOGGLE SENHA ================= */
function toggleSenha(id, icon){
  const input = document.getElementById(id);
  input.type = input.type === "password" ? "text" : "password";
  icon.classList.toggle("fa-eye");
  icon.classList.toggle("fa-eye-slash");
}

/* ================= ESTADOS COMPLETOS ================= */
const estados = {
"AC": "Acre",
"AL": "Alagoas",
"AP": "Amapá",
"AM": "Amazonas",
"BA": "Bahia",
"CE": "Ceará",
"ES": "Espírito Santo",
"GO": "Goiás",
"DF": "Distrito Federal",
"MA": "Maranhão",
"MT": "Mato Grosso",
"MS": "Mato Grosso do Sul",
"MG": "Minas Gerais",
"PA": "Pará",
"PB": "Paraíba",
"PR": "Paraná",
"PE": "Pernambuco",
"PI": "Piauí",
"RJ": "Rio de Janeiro",
"RN": "Rio Grande do Norte",
"RS": "Rio Grande do Sul",
"RO": "Rondônia",
"RR": "Roraima",
"SC": "Santa Catarina",
"SP": "São Paulo",
"SE": "Sergipe",
"TO": "Tocantins"
};

const estado = document.getElementById("estado");
const cidade = document.getElementById("cidade");

// Preenche estados
Object.entries(estados).forEach(([uf, nome])=>{
  let opt = document.createElement("option");
  opt.value = uf;
  opt.textContent = `${nome} (${uf})`;
  estado.appendChild(opt);
});

/* ================= CIDADES (IBGE API) ================= */
async function carregarCidades(uf, cidadeSelecionada = null){
  cidade.innerHTML = "<option>Carregando...</option>";

  try {
    const res = await fetch(`https://servicodados.ibge.gov.br/api/v1/localidades/estados/${uf}/municipios`);
    const data = await res.json();

    cidade.innerHTML = "";

    data.forEach(c => {
      let opt = document.createElement("option");
      opt.value = c.nome;
      opt.textContent = c.nome;
      cidade.appendChild(opt);
    });

    // Se veio cidade do CEP → seleciona automaticamente
    if(cidadeSelecionada){
      cidade.value = cidadeSelecionada;
    }

  } catch (erro) {
    cidade.innerHTML = "<option>Erro ao carregar cidades</option>";
  }
}

// Quando muda estado
estado.addEventListener("change", ()=>{
  carregarCidades(estado.value);
});

if(!data.erro){
endereco.value = data.logradouro;
estado.value = data.uf;
}

/* ================= VALIDAÇÃO ================= */
cadastroForm.addEventListener("submit", e=>{
e.preventDefault();

if(senha.value !== confirmarSenha.value){
alert("Senhas não conferem");
return;
}

alert("Cadastro realizado com sucesso!");
});

</script>

</body>
</html>
